<style>
:root{color-scheme:dark;--champagne:#E5B77A;--warm-gold:#C99055;--ivory:#F6F1E8;--muted:#B8BAC6;--line:#2B3445;--panel-navy:#0D1423;--deep-navy:#080E18}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:var(--deep-navy);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ivory);min-height:100dvh}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.app{min-height:100dvh;display:flex;flex-direction:column}
.header{height:78px;display:flex;gap:10px;padding:0 18px;align-items:center;border-bottom:1px solid var(--line);background:rgba(8,14,24,.96);position:sticky;top:0;z-index:30;backdrop-filter:blur(18px)}
.brandLogo{display:flex;align-items:center;height:54px;cursor:pointer;border:0;background:transparent;color:inherit;padding:0}
.brandMark{height:100%;width:auto;max-width:260px;display:block;border-radius:6px}
.backLink{margin-left:auto;color:#B8BAC6;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:12px;transition:all .15s ease}
.backLink:hover{border-color:var(--champagne);color:var(--champagne)}
.main{flex:1;padding:24px 18px 40px;max-width:660px;margin:0 auto;width:100%}
.eyebrow{margin:0;color:var(--champagne);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}

.introCard{padding:36px 28px;border:1px solid var(--line);border-radius:28px;background:rgba(13,20,35,.84);text-align:center;margin-top:28px}
.introCard h1{margin:18px 0 12px;font-size:30px;line-height:1.15;font-weight:900}
.introCard p{color:var(--muted);line-height:1.6;font-size:15px;margin:8px 0 0}
.introCard p strong{color:var(--ivory)}
.styles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px;text-align:left}
.styleChip{padding:12px 14px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:13px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.styleChip .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.styleChip strong{font-size:14px;font-weight:800}
.primaryBtn{margin-top:24px;border:0;border-radius:16px;padding:15px 28px;background:var(--champagne);color:#080E18;font-weight:850;font-size:15px;width:100%;box-shadow:0 0 30px rgba(229,183,122,.28)}
.primaryBtn:hover{background:var(--warm-gold)}

.testTop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#B8BAC6;margin-bottom:10px;font-size:13px}
.testTop > span{flex:1;text-align:center}
.testTop button{background:#121827;border:1px solid var(--line);color:#B8BAC6;border-radius:12px;padding:7px 12px;font-size:13px;transition:all .15s ease}
.testTop button:hover:not(:disabled){border-color:var(--champagne);color:var(--champagne)}
.testTop button:disabled{opacity:0;visibility:hidden;cursor:not-allowed}
#reset-btn{width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.progressTrack{height:8px;border-radius:999px;background:#121827;overflow:hidden;margin-bottom:22px}
.milestone{margin:-8px 0 14px;font-size:11px;color:var(--champagne);text-align:center;opacity:.85;letter-spacing:.08em;text-transform:uppercase;font-weight:600;min-height:14px}
.progressTrack div{height:100%;background:linear-gradient(90deg,var(--champagne),var(--warm-gold));transition:width .25s ease}

.qStem{margin:0 0 6px;color:var(--champagne);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.qHint{margin:0 0 14px;color:#B8BAC6;font-size:13px}
.qTitle{margin:0 0 18px;font-size:20px;line-height:1.4;font-weight:500}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:16px 18px;border:2px solid var(--line);background:rgba(13,20,35,.84);color:var(--ivory);border-radius:18px;font-size:15px;line-height:1.4;font-weight:500;transition:all .15s ease}
.opt:hover{border-color:var(--champagne)}
.opt:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(229,183,122,.45);border-color:var(--champagne)}
.opt.picked{border-color:var(--champagne);background:rgba(229,183,122,.16);transform:scale(.99)}
.optIdx{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#1C2438;color:var(--champagne);font-size:14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.opt.picked .optIdx{background:var(--champagne);color:#080E18}
.optText{flex:1;padding-top:5px}

.resultHero{text-align:center;padding:28px 22px;border:2px solid var(--accent,var(--champagne));border-radius:24px;background:#121827}
.resultHero .tag{margin:0 0 12px;color:#E5B77A;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.resultHero .headRow{display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap}
.resultHero h1{margin:0;font-size:36px;font-weight:900;line-height:1;color:var(--accent)}
.resultHero .pct{font-family:Georgia,serif;font-size:30px;font-weight:500;color:var(--accent)}
.resultHero .sub{display:block;margin-top:10px;color:#8E94A8;font-size:14px;line-height:1.5;max-width:520px;margin-left:auto;margin-right:auto}

.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#121827}

.rankRow{margin:6px 0 0;padding:8px 0}
.rankHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;color:#E0DBD0;font-size:14px}
.rankHead .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.rankHead .dot{width:10px;height:10px;border-radius:3px}
.rankHead .nm small{color:#7A8294;font-weight:400;font-size:12px;margin-left:6px}
.rankHead strong{font-size:15px;font-weight:500}
.rankBar{height:10px;border-radius:999px;background:#1C2438;overflow:hidden}
.rankBar > div{height:100%;border-radius:999px;transition:width .4s ease}
.rankRow.dominant .rankBar{outline:2px solid var(--accent);outline-offset:3px}
.rankRow.neglect .rankBar > div{opacity:.5}

.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:580px){.twoCol{grid-template-columns:1fr}}
.miniPanel{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#0D1423}
.miniPanel.green{border-color:rgba(34,197,94,.35)}
.miniPanel.red{border-color:rgba(239,68,68,.35)}
.miniPanel p.eyebrow{color:#22c55e;margin-bottom:10px}
.miniPanel.red p.eyebrow{color:#ef4444}
.miniItem{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;color:#E0DBD0;font-size:13.5px;font-weight:500}
.miniPanel.green .miniItem strong{color:#4ade80}
.miniPanel.red .miniItem strong{color:#f87171}

.wheelWrap{display:flex;justify-content:center;margin:14px 0 6px}
.wheelWrap svg{width:100%;max-width:380px;height:auto}
.wheelLegend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;font-size:12px;color:#B8BAC6;margin-top:4px}
.wheelLegend .lg{display:inline-flex;align-items:center;gap:6px}
.wheelLegend .lgDot{width:8px;height:8px;border-radius:50%}

.shareRow{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.shareRow button,.shareRow a{padding:13px 18px;border:1px solid var(--line);background:transparent;color:var(--ivory);border-radius:14px;font-weight:500;font-size:14px;text-align:center}
.shareRow .restart{background:var(--champagne);color:#080E18;border:0;font-weight:850;box-shadow:0 0 30px rgba(229,183,122,.28)}

.footer{text-align:center;padding:24px 18px;color:#7A8294;font-size:12px;border-top:1px solid var(--line);margin-top:auto}

@media (min-width:720px){.styles4{grid-template-columns:repeat(4,1fr)}.qTitle{font-size:22px}.resultHero h1{font-size:46px}.resultHero .pct{font-size:38px}}

.skip-link{position:fixed;top:-100px;left:12px;background:var(--champagne);color:#1A1109;padding:10px 16px;border-radius:8px;font-weight:500;z-index:200;text-decoration:none;transition:top .2s}.skip-link:focus{top:12px;outline:0}

/* F24 Cookie banner */
.cookieBanner{position:fixed;bottom:14px;left:14px;right:14px;z-index:65;max-width:560px;margin:0 auto;background:rgba(13,20,35,.96);backdrop-filter:blur(14px);border:1px solid rgba(229,183,122,.3);border-radius:14px;padding:14px 18px;display:none;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;box-shadow:0 16px 40px -16px rgba(0,0,0,.6);font-size:13px;color:#D8D6CF;line-height:1.5}
.cookieBanner.show{display:flex}
.cookieBanner p{margin:0;flex:1;min-width:220px}
.cookieBanner a{color:#E5B77A;text-decoration:underline;text-decoration-color:rgba(229,183,122,.4)}
.cookieBanner button{background:linear-gradient(180deg,#F0D5A8,#E5B77A 70%);color:#1A1109;border:0;padding:8px 18px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;font-family:Inter,sans-serif}
.cookieBanner button:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(229,183,122,.5)}
@media (max-width:480px){.cookieBanner{font-size:12.5px;padding:12px 14px}}
</style>

// F3: SAVE PROGRESS (localStorage)
  var SAVE_KEY = 'testomnia-' + location.pathname.replace(/[^a-z0-9-]/gi,'') + '-state';
  function savePersist(){
    try{
      if(state && state.screen==='q' && (Array.isArray(state.answers) ? state.answers.length : Object.keys(state.answers||{}).length)){
        localStorage.setItem(SAVE_KEY, JSON.stringify({i:state.idx,a:state.answers,t:Date.now()}));
      }
    }catch(e){}
  }
  function clearPersist(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
  function hasPersist(){
    try{
      var r = localStorage.getItem(SAVE_KEY);
      if(!r) return null;
      var d = JSON.parse(r);
      if(!d || !d.a) return null;
      var n = Array.isArray(d.a) ? d.a.length : Object.keys(d.a).length;
      if(!n) return null;
      if(Date.now() - d.t > 1000*60*60*24*30) return null;
      return d;
    }catch(e){return null}
  }
  function showResumeModal(d){
    var n = Array.isArray(d.a) ? d.a.length : Object.keys(d.a).length;
    var total = (state && state.qs ? state.qs.length : (typeof Q!=='undefined' ? Q.length : (typeof QUESTIONS!=='undefined' ? QUESTIONS.length : '?')));
    return confirm('Mamy zapisany niedokonczony test (pytanie ' + (d.i+1) + ' z ' + total + ', ' + n + ' odpowiedzi).\n\nKliknij OK zeby wznowic, Anuluj zeby zaczac od nowa.');
  }

let var prev=hasPersist();if(prev&&showResumeModal(prev)){clearPersist();state={screen:\"intro\",idx:prev.i,answers:prev.a};}else{clearPersist();state={screen:\"intro\", idx:0, answers:[]};}
const root = document.getElementById("root");

function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function go(s){state.screen=s;render();window.scrollTo({top:0,behavior:"smooth"});}

function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="q") return renderQuestion();
  if(state.screen==="r") return renderResult();
}

function renderIntro(){
  const chips = STYLE_ORDER.map(k=>{const s=STYLES[k];return `<div class="styleChip"><span class="dot" style="background:${s.color}"></span><div><strong>${s.name}</strong></div></div>`;}).join("");
  root.innerHTML = `
    <section class="introCard">
      <p class="eyebrow">Test stylu przywództwa</p>
      <h1>Jaki masz styl?</h1>
      <p>18 sytuacji z życia menedżera. W każdej zobaczysz 4 możliwe reakcje. Wybierz tę która <strong>najbardziej</strong> pasuje do Ciebie.</p>
      <p style="margin-top:14px"><strong>Każda odpowiedź jest valid</strong> — nie ma „dobrej” i „złej”. Pytanie tylko która z nich jest najbliżej Ciebie. Test ujawni Twój dominujący styl + obszary do pracy.</p>
      <p style="margin-top:14px;font-size:13px;color:#B8BAC6">Klik = następne pytanie. Test trwa ok. 4 minuty.</p>
      <div class="styles4">${chips}</div>
      <button class="primaryBtn" id="start-btn">Rozpocznij test →</button>
    </section>
  `;
  document.getElementById("start-btn").onclick = ()=>{
    state.idx=0;state.answers=[];
    state.qs = Q.map(q=>{
      const idxs = shuffle([0,1,2,3]);
      return {...q, shuffled: idxs.map(i=>q.opts[i])};
    });
    go("q");
  };
}

function renderQuestion(){
  const q = state.qs[state.idx];
  const total = state.qs.length;
  const picked = state.answers[state.idx];
  const answered = state.answers.filter(a=>a!==undefined && a!==null).length;
  const pct = Math.round((answered/total)*100);

  const optRows = q.shuffled.map((opt,i)=>{
    return `<button class="opt${picked===i?' picked':''}" data-i="${i}">
      <span class="optIdx">${String.fromCharCode(65+i)}</span>
      <span class="optText">${opt.t}</span>
    </button>`;
  }).join("");

  root.innerHTML = `
    <div class="testTop">
      <button id="back-btn"${state.idx===0?' disabled':''}>← Wstecz</button>
      <span>Pytanie ${state.idx+1} / ${total} · ${pct}%</span>
      <button id="reset-btn" title="Zacznij od nowa" aria-label="Zacznij test od nowa">×</button>
    </div>
    <div class="progressTrack"><div style="width:${pct}%"></div></div>
      <div class="milestone">${pct<25?"Dobry start!":pct<50?"Już 1/4 za Tobą":pct<75?"Połowa zrobiona":pct<95?"Ostatnia prosta":"Ostatnie pytania"}</div>

    <h1 class="qTitle">${q.stem}</h1>
    <p class="qHint">Co byś zrobił najbardziej naturalnie?</p>
    <section class="opts">${optRows}</section>
  `;

  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.i,10);
      state.answers[state.idx] = i; savePersist();
      b.classList.add("picked");
      setTimeout(()=>{
        if(state.idx===state.qs.length-1) go("r");
        else {state.idx++;render();window.scrollTo({top:0,behavior:"smooth"});}
      }, 200);
    };
  });

  document.getElementById("back-btn").onclick = ()=>{
    if(state.idx>0){state.idx--;render();window.scrollTo({top:0,behavior:"smooth"});}
  };
  document.getElementById("reset-btn").onclick = ()=>{
    if(confirm("Zacząć od nowa? Stracisz dotychczasowe odpowiedzi.")){
      state.idx=0;state.answers=[];state.qs=null;go("intro");
    }
  };
}

function computeScores(){
  const styleScore = {S:0,A:0,O:0,F:0};
  const subScore = {};
  Object.keys(SUBDIM_LABELS).forEach(k=>{subScore[k]=0;});
  state.answers.forEach((a,qi)=>{
    if(a===undefined||a===null) return;
    const opt = state.qs[qi].shuffled[a];
    styleScore[opt.st]++;
    subScore[opt.sub]++;
  });
  return {styleScore, subScore};
}

function renderResult(){
    clearPersist();
    clearPersist();
    setTimeout(function(){var h=document.querySelector(".resultHero h1");if(h)h.focus()},120);
  const {styleScore, subScore} = computeScores();
  const total = state.answers.filter(a=>a!==undefined && a!==null).length;

  const styleData = STYLE_ORDER.map(k=>{
    const count = styleScore[k];
    const pct = total>0 ? Math.round((count/total)*1000)/10 : 0;
    return {k, name:STYLES[k].name, color:STYLES[k].color, count, pct};
  });
  let pctSum = styleData.reduce((s,d)=>s+d.pct,0);
  if(Math.abs(pctSum-100)>0.05 && styleData[0]){
    const diff = 100 - pctSum;
    styleData[0].pct = Math.round((styleData[0].pct + diff)*10)/10;
  }
  styleData.sort((a,b)=>b.count-a.count);
  const dom = styleData[0];
  const neg = styleData[styleData.length-1];

  const subData = Object.entries(subScore).map(([k,v])=>{
    const styleKey = STYLE_ORDER.find(sk=>STYLES[sk].subs.includes(k));
    return {k, label:SUBDIM_LABELS[k], count:v, styleKey, color:STYLES[styleKey].color};

  const subSorted = [...subData].sort((a,b)=>b.count-a.count);

        <strong${isDom?' style="color:'+d.color+'"':''}>${d.pct.toFixed(1)}%</strong>

  const topRows = top3.map(s=>{

  const botRows = bottom3.map(s=>{
    return `<div class="miniItem"><span>${s.label}</span><strong>${s.count}/6</strong></div>`;
  }).join("");

  const wheel = renderWheel(subData);

  let interp = `<p>Jesteś liderem typu <strong style="color:${dom.color}">${dom.name}</strong>. ${STYLES[dom.k].desc}</p>`;
  if(neg.count < dom.count-3){
    interp += `<p style="margin-top:10px"><strong>Zaniedbany styl:</strong> ${neg.name} (${neg.pct.toFixed(1)}%). Konsekwentnie rzadziej wybierasz reakcje tego typu. Najbardziej brakuje Ci: <span style="color:${bottom3[0].color}">${bottom3[0].label}</span>.</p>`;
  }
  if(top3.length>0 && top3[0].count>=3){
    interp += `<p style="margin-top:10px"><strong>Twoje 3 najmocniejsze obszary:</strong> ${top3.map(s=>s.label).join(", ")}.</p>`;
  }

  root.innerHTML = `
    <section class="resultHero" style="--accent:${dom.color}">
      <p class="tag">Twój dominujący styl</p>
      <div class="headRow">
        <h1>${dom.name}</h1>
        <span class="pct">${dom.pct.toFixed(1)}%</span>
      </div>
      <p class="sub">${STYLES[dom.k].desc}</p>
    </section>
    <section class="panel">
      <p class="eyebrow">Hierarchia 4 stylów</p>
      ${rankRows}
    </section>
    <div class="twoCol">
      <div class="miniPanel green">
        <p class="eyebrow">Twoje 3 mocne strony</p>
        ${topRows}
      </div>

        <p class="eyebrow">Top 3 do pracy</p>
        ${botRows}
      </div>
    </div>
    <section class="panel">
      <p class="eyebrow">Koło 12 obszarów</p>
      <div class="wheelWrap">${wheel}</div>

  document.getElementById("restart-btn").onclick = ()=>{

function renderWheel(subData){
  const cx=200, cy=200, rMax=140, rMin=25;
  const orderedSubs = [];
  STYLE_ORDER.forEach(sk=>{
    STYLES[sk].subs.forEach(sub=>{
      const d = subData.find(x=>x.k===sub);
      orderedSubs.push({...d, styleKey:sk});
    });
  });
  const n = orderedSubs.length;
  const angleStep = 360/n;
  const toRad = a => (a-90)*Math.PI/180;
  function ptForCount(idx, count){
    const r = rMin + (count/6)*(rMax-rMin);
    const a = toRad(idx*angleStep + angleStep/2);
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  }
  const polyPts = orderedSubs.map((s,i)=>ptForCount(i, s.count).join(",")).join(" ");
  const dots = orderedSubs.map((s,i)=>{
    const [x,y] = ptForCount(i, s.count);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${s.color}" stroke="#0D1423" stroke-width="1.5"/>`;
  }).join("");
  let labels = "";
  orderedSubs.forEach((s,i)=>{
    const a = toRad(i*angleStep + angleStep/2);
    const r = rMax + 22;
    const lx = cx + Math.cos(a)*r;
    const ly = cy + Math.sin(a)*r;
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="500" fill="${s.color}">${s.label}</text>`;
  });
  let sectors = "";
  STYLE_ORDER.forEach((sk,si)=>{
    const a1 = toRad(si*3*angleStep);
    const a2 = toRad((si+1)*3*angleStep);
    const x1 = cx + Math.cos(a1)*rMax;
    const y1 = cy + Math.sin(a1)*rMax;
    const x2 = cx + Math.cos(a2)*rMax;
    const y2 = cy + Math.sin(a2)*rMax;
    sectors += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${rMax} ${rMax} 0 0 1 ${x2} ${y2} Z" fill="${STYLES[sk].color}" opacity=".04"/>`;
  });
  let rings = "";
  [rMin, rMin+(rMax-rMin)*0.5, rMax].forEach(r=>{
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2B3445" stroke-width="0.5" stroke-dasharray="${r===rMax?'':'2 3'}" opacity="${r===rMax?1:0.4}"/>`;
  });
  return `<svg viewBox="0 0 400 400" role="img" aria-label="Koło 12 obszarów stylów przywództwa">
    ${sectors}
    ${rings}
    <line x1="${cx}" y1="${cy-rMax}" x2="${cx}" y2="${cy+rMax}" stroke="#1f1c17" stroke-width="0.5"/>
    <line x1="${cx-rMax}" y1="${cy}" x2="${cx+rMax}" y2="${cy}" stroke="#1f1c17" stroke-width="0.5"/>
    <polygon points="${polyPts}" fill="rgba(229,183,122,.1)" stroke="#E5B77A" stroke-width="1.5" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

document.getElementById("brand-btn").addEventListener("click",(e)=>{
  if(state.screen !== "intro" && !confirm("Wrócić do menu testów? Stracisz dotychczasowe odpowiedzi.")) e.preventDefault();
});
document.getElementById("back-link").addEventListener("click",(e)=>{
  if(state.screen !== "intro" && !confirm("Wrócić do menu testów? Stracisz dotychczasowe odpowiedzi.")) e.preventDefault();
});

render();
</script>

<div class="cookieBanner" id="cookieBanner" role="dialog" aria-label="Informacja o cookies">
  <p>Używamy tylko <strong>niezbędnych cookies</strong> (zapisanie postępu w teście). Bez trackingu ani reklam. <a href="polityka-prywatnosci.html">Polityka</a>.</p>
  <button type="button" id="cookieAck">OK, rozumiem</button>
</div>
<script>
(function(){
  try{
    if(localStorage.getItem('cookie-ack')==='1')return;
    var b=document.getElementById('cookieBanner');if(!b)return;
    setTimeout(function(){b.classList.add('show')},900);
    document.getElementById('cookieAck').addEventListener('click',function(){
      try{localStorage.setItem('cookie-ack','1')}catch(e){}
      b.classList.remove('show');
    });
  }catch(e){}
})();
</script>
