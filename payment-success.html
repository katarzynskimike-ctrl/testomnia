<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Płatność zakończona · Testomnia</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:#080E18;color:#D8D6CF;font-family:Inter,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.card{background:#0D1423;border:1px solid #1f2638;border-radius:20px;padding:40px 32px;max-width:520px;text-align:center}
.icon{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#22c55e;font-size:38px;font-weight:700}
h1{margin:0 0 12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:500;color:#F6F1E8}
p{margin:0 0 16px;color:#D8D6CF}
.muted{font-size:13px;color:#9CA0B1}
.btn{display:inline-flex;align-items:center;gap:8px;background:#E5B77A;color:#1a1109;padding:14px 24px;border-radius:999px;text-decoration:none;font-weight:600;margin-top:18px}
.btn:hover{background:#F0D5A8}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>Dziękujemy za zakup!</h1>
  <p>Twój pełny raport rozwojowy w&nbsp;PDF zostanie wysłany na&nbsp;Twój email w&nbsp;ciągu 5&nbsp;minut.</p>
  <p class="muted">Sprawdź też folder „Spam" lub „Promocje" jeśli mail nie&nbsp;przyjdzie.</p>
  <a class="btn" href="/">← Powrót do strony głównej</a>
</div>
</body></html>
