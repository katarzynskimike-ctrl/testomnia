<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="testomnia — Test za 0 zł. Raport za cenę kilku kaw.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#131826"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#A87C4F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A87C4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C499"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C499"/>
      <stop offset="100%" stop-color="#A87C4F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid pattern (decorative) -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Brand mark + name -->
  <g transform="translate(80, 85)">
    <rect width="56" height="56" rx="14" fill="url(#markGrad)"/>
    <text x="28" y="42" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#1A1109" text-anchor="middle" font-weight="700">t</text>
    <text x="80" y="40" font-family="Inter, sans-serif" font-size="26" fill="#F5F4F0" font-weight="600" letter-spacing="-0.5">testomnia</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80, 220)">
    <line x1="0" y1="8" x2="32" y2="8" stroke="#D4A574" stroke-width="2" opacity="0.7"/>
    <text x="44" y="14" font-family="Inter, sans-serif" font-size="16" fill="#D4A574" font-weight="600" letter-spacing="3">PROFESJONALNE TESTY DLA ZESPOŁÓW MEDYCZNYCH</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80, 290)">
    <text x="0" y="0" font-family="Instrument Serif, Georgia, serif" font-size="88" fill="#F5F4F0" letter-spacing="-2">
      <tspan x="0" dy="0">Test za 0 zł.</tspan>
      <tspan x="0" dy="100">Raport za cenę </tspan>
      <tspan font-style="italic" fill="url(#copperText)">kilku kaw.</tspan>
    </text>
  </g>

  <!-- Bottom row: stats -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="18" fill="#C9CAD3">
      <tspan font-weight="600">7</tspan> testów ·
      <tspan font-weight="600">32–84</tspan> stron raportu ·
      <tspan font-weight="600">4.8/5</tspan> z opinii ·
      <tspan font-weight="600">RODO</tspan>
    </text>
  </g>

  <!-- Right side decoration: layered cards / mockup -->
  <g transform="translate(770, 200)" opacity="0.95">
    <!-- back card -->
    <rect x="40" y="40" width="320" height="380" rx="20" fill="#EDE6D5" opacity="0.5" transform="rotate(6 200 230)"/>
    <!-- middle card -->
    <rect x="20" y="20" width="320" height="380" rx="20" fill="#F4EFE0" opacity="0.7" transform="rotate(3 180 210)"/>
    <!-- front card -->
    <rect x="0" y="0" width="320" height="380" rx="20" fill="#FAF8F2"/>

    <!-- card header -->
    <rect x="0" y="0" width="320" height="68" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1" stroke-dasharray="0 0 320 0"/>
    <line x1="20" y1="68" x2="300" y2="68" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
    <rect x="20" y="24" width="16" height="16" rx="4" fill="url(#markGrad)"/>
    <text x="42" y="36" font-family="Inter, sans-serif" font-size="10" fill="#7a5a35" font-weight="600" letter-spacing="1.5">TESTOMNIA</text>
    <text x="300" y="32" font-family="Inter, sans-serif" font-size="9" fill="#7a6f60" text-anchor="end">Raport indywidualny</text>
    <text x="300" y="46" font-family="Inter, sans-serif" font-size="9" fill="#7a6f60" text-anchor="end">str. 14 / 38</text>

    <!-- card title -->
    <text x="20" y="106" font-family="Instrument Serif, Georgia" font-size="22" fill="#1c160f">Test 4 typów osobowości</text>
    <text x="20" y="126" font-family="Inter, sans-serif" font-size="10" fill="#7a6f60" letter-spacing="0.5">PROFIL KOMUNIKACYJNY</text>

    <!-- chart area -->
    <rect x="20" y="148" width="280" height="120" rx="10" fill="#fff" stroke="rgba(0,0,0,.06)" stroke-width="1"/>
    <path d="M30,250 C70,220 110,180 150,165 C200,140 240,165 280,140 C295,128 310,140 290,128 L290,260 L30,260 Z"
          fill="#D4A574" opacity="0.35"/>
    <path d="M30,250 C70,220 110,180 150,165 C200,140 240,165 280,140 C295,128 310,140 290,128"
          stroke="#A87C4F" stroke-width="2" fill="none"/>
    <circle cx="90" cy="210" r="3" fill="#1A1109"/>
    <circle cx="150" cy="165" r="3" fill="#1A1109"/>
    <circle cx="220" cy="155" r="3" fill="#1A1109"/>
    <circle cx="280" cy="140" r="3" fill="#1A1109"/>

    <!-- pills -->
    <g transform="translate(20, 286)">
      <rect width="86" height="22" rx="11" fill="#1A1109"/>
      <text x="43" y="15" font-family="Inter, sans-serif" font-size="10" fill="#D4A574" font-weight="600" text-anchor="middle">Mówca · 64%</text>
    </g>
    <g transform="translate(112, 286)">
      <rect width="106" height="22" rx="11" fill="#1A1109"/>
      <text x="53" y="15" font-family="Inter, sans-serif" font-size="10" fill="#D4A574" font-weight="600" text-anchor="middle">Racjonalny · 71%</text>
    </g>

    <!-- bottom lines -->
    <rect x="20" y="324" width="260" height="6" rx="3" fill="#eadfca"/>
    <rect x="20" y="338" width="220" height="6" rx="3" fill="#eadfca"/>
    <rect x="20" y="352" width="240" height="6" rx="3" fill="#eadfca"/>

    <!-- seal -->
    <circle cx="280" cy="345" r="22" fill="url(#markGrad)"/>
    <text x="280" y="354" font-family="Instrument Serif, Georgia" font-style="italic" font-size="20" fill="#1A1109" text-anchor="middle" font-weight="700">t</text>
  </g>

  <!-- "PDF" badge floating -->
  <g transform="translate(1060, 175)">
    <rect width="100" height="34" rx="17" fill="#1A1109" stroke="rgba(212,165,116,.4)" stroke-width="1"/>
    <text x="50" y="22" font-family="Instrument Serif, Georgia" font-style="italic" font-size="16" fill="#D4A574" text-anchor="middle">raport · PDF</text>
  </g>
</svg>
